# typos configuration (#68, `just lint` and the pre-commit hook). typos only knows English, so the
# exclusions are generated, third-party or non-English content: KiCad files, lockfiles, build and
# coverage output, the schematic SVGs, and the French troubleshooting guides (#79).
[files]
extend-exclude = [
  "catalogue/",
  "troubleshooting/",
  "build/",
  "coverage/",
  "dist/",
  "pnpm-lock.yaml",
  "*.lock",
  "*.svg",
]

[default]
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b", # commit SHAs and digests
  "\\bPVT_[A-Za-z0-9]+\\b", # GitHub Projects v2 node ids
]
