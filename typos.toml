# typos configuration (#68, `just lint` and the pre-commit hook). typos only knows English, so the
# exclusions are generated, third-party or non-English content: KiCad files, lockfiles, build and
# coverage output, the schematic SVGs, the French troubleshooting guides (#79) and the French
# captions of their figures (#101).
[files]
extend-exclude = [
  "catalogue/",
  "troubleshooting/",
  "scripts/figures/guide_*.py",
  "build/",
  "coverage/",
  "dist/",
  "pnpm-lock.yaml",
  "*.lock",
  "*.svg",
]

[default]
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b", # commit SHAs and digests
  "\\bPVT_[A-Za-z0-9]+\\b", # GitHub Projects v2 node ids
  "\"[0-9i][0-9]_[a-z_]+\"", # French guide folder names (scripts/figures/generate.py)
]
