# typos configuration (#68, `just lint` and the pre-commit hook). Everything written here is English;
# the exclusions are generated or third-party content: KiCad files, lockfiles, build and coverage
# output, the schematic SVGs.
[files]
extend-exclude = [
  "catalogue/",
  "build/",
  "coverage/",
  "dist/",
  "pnpm-lock.yaml",
  "*.lock",
  "*.svg",
]

[default]
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b", # commit SHAs and digests
  "\\bPVT_[A-Za-z0-9]+\\b", # GitHub Projects v2 node ids
]
