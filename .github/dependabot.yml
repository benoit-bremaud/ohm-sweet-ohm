version: 2
updates:
  # Base images never move on their own: one entry per Dockerfile.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /docker/renderer
    schedule:
      interval: weekly
  # Actions are pinned by commit SHA; only Dependabot moves them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # One grouped pull request a week for the whole pnpm workspace.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
