name: Catalogue

on:
  pull_request:
    paths:
      - catalogue/**
      - docker/renderer/**
      - scripts/render-catalogue.sh
      - .github/workflows/catalogue.yml
  push:
    branches: [main]
    paths:
      - catalogue/**
      - docker/renderer/**
      - scripts/render-catalogue.sh
      - .github/workflows/catalogue.yml
      # The importer and the packages it runs change what is written to the database.
      - apps/importer/**
      - packages/**
      - pnpm-lock.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-${{ github.ref }}
  # Superseded pull-request runs are cancelled; a main run feeds the staging database and must
  # finish, so later pushes queue behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    name: Render schematics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build renderer image
        run: docker build -t ohm-sweet-ohm-renderer docker/renderer
      - name: Render every schematic to a cropped SVG
        run: |
          mkdir -p build
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD:/repo" -w /repo --entrypoint scripts/render-catalogue.sh \
            ohm-sweet-ohm-renderer
      - name: Check one SVG per schematic
        run: |
          expected=$(find catalogue -name schematic.kicad_sch | wc -l)
          actual=$(find build/catalogue -name schematic.svg -size +1k | wc -l)
          echo "schematics: $expected, rendered: $actual"
          test "$expected" -eq "$actual"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalogue-svg
          path: build/catalogue
          retention-days: 7

  import:
    name: Import into the staging database
    # Only main feeds the staging database shared by every web preview (ADR-0004), whether the
    # run comes from a push or from a manual trigger.
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalogue-svg
          path: build/catalogue
      - name: Mirror the catalogue folder into the database
        run: pnpm catalogue:import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
