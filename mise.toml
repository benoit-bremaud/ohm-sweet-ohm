# Local CI toolchain (#68, skill local-ci): every CLI the justfile tiers and the lefthook hooks call,
# pinned; `mise.lock` pins the checksums. `just setup` installs it. System tools stay outside mise:
# docker (API and renderer images, Trivy image scan), flyctl (deploys) and sonar-scanner (not in
# the mise registry, skill infra-accounts). Semgrep runs through `uvx` (justfile): a mise pipx
# install would need a mise-managed Python.
#
# Node and pnpm match .nvmrc / package.json#packageManager, so the hooks run the project's own
# toolchain whether or not the shell activates asdf or mise.
[tools]
node = "22.23.4"
pnpm = "10.30.3"
uv = "0.13.7"            # `uvx semgrep@…`
just = "1.59.0"
lefthook = "2.2.2"
typos = "1.52.0"
actionlint = "1.7.12"
zizmor = "1.32.0"
shellcheck = "0.11.0"
gitleaks = "8.30.1"
trufflehog = "3.99.8"
hadolint = "2.15.1"      # apps/api/Dockerfile, docker/renderer/Dockerfile
trivy = "0.76.2"         # fs, Dockerfile config, the API image
syft = "1.57.0"          # SBOM of the API image
act = "0.2.92"           # `just rehearse`; pinned: its log format is parsed (needs docker)

[env]
# The standalone pnpm binary ships its own CA bundle and refuses the certificate the Aikido
# safe-chain proxy presents for registry.npmjs.org (`pnpm audit`, `pnpm install`); the system
# bundle holds that CA (skill aikido-device-protection).
NODE_EXTRA_CA_CERTS = "/etc/ssl/certs/ca-certificates.crt"

[settings]
lockfile = true
