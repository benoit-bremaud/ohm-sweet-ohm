# SonarQube analysis, run locally by `just sonar` (in `just gate`) against the shared self-hosted instance
# (http://localhost:9000, sonarqube-stack repo). Authentication: the machine's global analysis
# token, read from SONAR_TOKEN or ~/.config/sonarqube/analysis-token. Never put a token here.

sonar.projectKey=ohm-sweet-ohm
sonar.projectName=Ohm Sweet Ohm
sonar.sourceEncoding=UTF-8

sonar.sources=apps/api/src,apps/importer/src,apps/web/src,packages/db/src,packages/domain/src,packages/schemas/src
sonar.tests=apps/api/src,apps/importer/src,apps/web/src,packages/db/src,packages/domain/src,packages/schemas/src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/*.test.ts,**/*.d.ts,**/node_modules/**

# Written by `pnpm test:coverage`; the same main.ts exclusion as vitest.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/src/main.ts

# Fails the scan when the quality gate fails.
sonar.qualitygate.wait=true
