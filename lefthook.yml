# Git hooks for the local CI (#68, skill local-ci): tier L0 on commit, L1 on push. Install once per
# clone: `just setup` (mise install, lefthook install). `mise x --` puts the pinned tools of
# mise.toml (Node 22 and pnpm included) on PATH whether or not the shell activates mise.
pre-commit:
  parallel: true
  jobs:
    - name: staged secrets
      run: mise x -- gitleaks git --staged --redact --no-banner .
    - name: eslint
      glob: '*.{ts,mts,mjs,astro}'
      run: mise x -- pnpm exec eslint {staged_files}
    - name: prettier
      glob: '*.{ts,mts,mjs,astro,json,jsonc,yml,yaml,css}'
      run: mise x -- pnpm exec prettier --check {staged_files}
    - name: markdownlint
      glob: '*.md'
      run: mise x -- pnpm exec markdownlint-cli2 {staged_files}
    - name: typos
      run: mise x -- typos --force-exclude {staged_files}
    - name: actionlint
      glob: '.github/workflows/*.{yml,yaml}'
      run: mise x -- actionlint {staged_files}
    - name: hadolint
      glob: '**/Dockerfile'
      run: mise x -- hadolint --config .hadolint.yaml {staged_files}
    - name: shellcheck
      glob: '*.sh'
      run: mise x -- shellcheck --severity=warning {staged_files}

commit-msg:
  jobs:
    - name: conventional commit subject
      run: sh scripts/check-commit-msg.sh {1}

pre-push:
  jobs:
    - name: just check (L1)
      # The check runs on the working tree, so it must equal the pushed commits.
      run: >-
        git diff --quiet HEAD --
        || { echo "pre-push: commit or set aside the uncommitted changes first" >&2; exit 1; };
        mise x -- just check
