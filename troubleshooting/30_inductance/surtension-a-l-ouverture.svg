  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Tension aux bornes d'une bobine quand on coupe son courant</title>
  <desc id="d">Courbe de la tension aux bornes d'une bobine alimentée en 24 volts continus, en fonction du temps. Avant l'ouverture, la tension vaut 24 volts. À l'ouverture, sans diode, elle plonge à environ moins 300 volts puis revient à zéro. Avec une diode de roue libre en parallèle sur la bobine, elle reste à environ moins 1,4 volt puis revient à zéro. La bobine s'oppose à l'arrêt du courant : plus la coupure est brusque, plus la tension monte. Cette pointe dépasse largement 50 volts : couper l'alimentation avant de débrancher une bobine, ne jamais l'ouvrir sous courant.</desc>
