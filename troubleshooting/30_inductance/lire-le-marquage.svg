  <title id="t">Lire le marquage à trois caractères d'une inductance CMS</title>
  <desc id="d">Trois inductances de puissance CMS vues de dessus, chacune avec son marquage. 4R7 se lit 4,7 microhenrys : la lettre R tient la place de la virgule. 100 se lit 10 microhenrys : 10 suivi de zéro zéro. 101 se lit 100 microhenrys : 10 suivi d'un zéro. La règle : les deux premiers chiffres donnent la valeur, le troisième le nombre de zéros à ajouter, le résultat est en microhenrys. Le marquage 100 se lit 10 microhenrys et non 100 : en cas de doute, lire la valeur sur le schéma ou la mesurer.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="420" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Lire le marquage d'une inductance CMS</text>
  <text class="mut" x="24" y="60" font-size="14">Code à trois caractères, résultat en microhenrys (µH)</text>
  <rect x="68" y="138" width="124" height="44" fill="#9aa3ad"/>
