  <text x="130" y="169" font-size="26" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffffff">4R7</text>
  <text class="blue" x="130" y="246" font-size="18" text-anchor="middle" font-weight="700">4,7 µH</text>
  <text class="mut" x="130" y="268" font-size="12" text-anchor="middle">R tient la place de la virgule</text>
  <rect x="318" y="138" width="124" height="44" fill="#9aa3ad"/>
  <rect x="330" y="110" width="100" height="100" rx="12" fill="#20242b" stroke="#7d8794" stroke-width="1.5"/>
  <text x="380" y="169" font-size="26" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffffff">100</text>
  <text class="blue" x="380" y="246" font-size="18" text-anchor="middle" font-weight="700">10 µH</text>
  <text class="mut" x="380" y="268" font-size="12" text-anchor="middle">10 suivi de 0 zéro</text>
  <rect x="568" y="138" width="124" height="44" fill="#9aa3ad"/>
  <rect x="580" y="110" width="100" height="100" rx="12" fill="#20242b" stroke="#7d8794" stroke-width="1.5"/>
  <text x="630" y="169" font-size="26" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffffff">101</text>
  <text class="blue" x="630" y="246" font-size="18" text-anchor="middle" font-weight="700">100 µH</text>
  <text class="mut" x="630" y="268" font-size="12" text-anchor="middle">10 suivi de 1 zéro</text>
  <path class="grid" d="M24 296 H736"/>
  <text class="fg" x="24" y="326" font-size="15" font-weight="700">La règle</text>
  <text class="mut" x="24" y="350" font-size="12">Les deux premiers chiffres donnent la valeur, le troisième le nombre de zéros à ajouter.</text>
  <text class="mut" x="24" y="368" font-size="12">La lettre R remplace la virgule quand la valeur est inférieure à 10 µH.</text>
  <text class="warn" x="24" y="398" font-size="12" font-weight="700">« 100 » se lit 10 µH, pas 100 µH : en cas de doute, lire la valeur sur le schéma ou la mesurer.</text>
