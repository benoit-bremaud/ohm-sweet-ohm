  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Test d'oscillation d'un bobinage à l'oscilloscope</title>
  <desc id="d">En haut, le montage : un générateur d'impulsions, un condensateur de 0,001 à 1 microfarad et le bobinage à tester sont branchés en parallèle, et un oscilloscope mesure la tension à leurs bornes. En bas, deux écrans. À gauche, la tension oscille pendant plusieurs cycles en s'amortissant lentement : le bobinage est sain. À droite, l'oscillation s'éteint en moins de deux cycles : une spire en court-circuit est probable. Contrôler d'abord la continuité à l'ohmmètre. Sous 10 microhenrys, comparer avec un composant identique reconnu bon.</desc>
