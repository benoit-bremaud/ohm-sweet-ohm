<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 466" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Polarité et marquage d'un condensateur tantale</title>
  <desc id="d">À gauche, un condensateur tantale CMS vu de dessus, marqué 476 et 16 V : une barre à une extrémité repère le côté positif. Au centre, un condensateur tantale goutte traversant, marqué 47 µ et 16 V : un signe plus, ou une barre, repère la patte positive. À droite, pour comparer, un condensateur électrolytique aluminium CMS vu de dessus : son secteur noir repère au contraire le côté négatif. En bas, la lecture de la valeur : 476 vaut 47 suivi de 6 zéros en picofarads, soit 47 µF ; 47 µ vaut 47 µF, 4 µ 7 vaut 4,7 µF et µ 47 vaut 0,47 µF ; 16 V est la tension maximale de service, à utiliser bien en dessous. Monté à l'envers ou en surtension, un tantale se met en court-circuit, chauffe et peut s'enflammer.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
