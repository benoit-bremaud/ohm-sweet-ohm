<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Tension d'emploi d'un condensateur tantale par rapport à sa tension marquée</title>
  <desc id="d">Échelle de tension de 0 à 20 V pour un condensateur tantale marqué 16 V, à électrolyte solide au dioxyde de manganèse. De 0 à 8 V, zone verte d'emploi normal ; de 8 à 16 V, zone orange de marge de sécurité ; au-delà de 16 V, zone rouge interdite. Un rail de 5 V convient : moins de la moitié de 16 V. Un rail de 12 V est trop près de 16 V : risque de claquage. Règle des fabricants : ne pas dépasser 50 % de la tension marquée, soit 8 V pour un 16 V ; pour un tantale à électrolyte polymère, 80 %. Seconde échelle, tension appliquée à l'envers : la limite est de 10 % de la tension marquée, sans dépasser 1 V, pour de brefs instants seulement, à 25 °C ; tout le reste est interdit. Monté à l'envers sur un rail de 3,3 V ou plus, un tantale dépasse largement cette limite.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
