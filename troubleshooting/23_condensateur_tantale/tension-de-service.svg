  <text class="mut" x="60" y="456" font-size="12">À l'envers, la limite est de 10 % de la tension marquée, sans dépasser 1 V, pour de brefs instants seulement (à 25 °C).</text>
  <text class="mut" x="60" y="473" font-size="12">Monté à l'envers sur un rail de 3,3 V ou plus, un tantale dépasse largement cette limite.</text>
