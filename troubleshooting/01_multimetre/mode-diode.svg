  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Mode diode : tension directe dans un sens, hors limite dans l'autre</title>
  <desc id="d">Deux multimètres, sélecteur sur le symbole diode, cordon rouge dans la douille V ohms, testent la même diode au silicium hors tension. À gauche, pointe rouge sur l'anode : un courant d'environ 1 mA traverse la jonction, l'appareil lit 0,582 V. À droite, pointes inversées : la jonction bloque, l'appareil affiche OL. Proche de 0 V dans les deux sens : court-circuit ; OL dans les deux sens : diode ouverte, ou tension directe hors de portée.</desc>
