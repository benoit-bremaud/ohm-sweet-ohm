  <title id="t">Voltmètre alternatif : mesure en parallèle, sans polarité</title>
  <desc id="d">Un multimètre, sélecteur sur volts alternatifs, cordon rouge dans la douille V ohms, a ses pointes en parallèle sur la sortie d'un adaptateur secteur externe 12 V alternatif qui alimente une charge. Il lit 12,1 V, la valeur efficace. Le sens des pointes est indifférent.</desc>
