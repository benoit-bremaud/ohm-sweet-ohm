  <title id="t">Voltmètre continu : mesure en parallèle sur une carte alimentée</title>
  <desc id="d">Un multimètre, sélecteur sur volts continus, cordon rouge dans la douille V ohms, a sa pointe rouge sur le rail +5 V et sa pointe noire sur la masse d'une carte alimentée par une alimentation limitée en courant. Il lit 5,02 V. Le courant de la carte ne passe pas par l'appareil, dont l'entrée présente 1 à 10 MΩ.</desc>
