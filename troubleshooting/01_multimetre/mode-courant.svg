  <title id="t">Mode courant : mesure en série, et piège du cordon oublié sur la douille 10 A</title>
  <desc id="d">À gauche, la mesure : sélecteur sur ampères continus, cordon rouge dans la douille 10 A, l'appareil est inséré en série dans le fil coupé entre une alimentation limitée et sa charge ; il lit 0,15 A. À droite, le piège : sélecteur sur volts continus mais cordon rouge resté dans la douille 10 A, pointes en parallèle sur une batterie ; le shunt de l'appareil court-circuite la source, des dizaines d'ampères circulent, et la douille 10 A est souvent sans fusible.</desc>
