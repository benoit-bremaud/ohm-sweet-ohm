  <text class="fg" x="490" y="122" font-size="14" font-weight="700">Ce qui fait sonner l'appareil</text>
  <rect x="490" y="136" width="120" height="24" rx="5" fill="#16a34a"/>
  <rect x="610" y="136" width="126" height="24" rx="5" fill="#9aa3ae"/>
  <text x="550" y="153" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">bip</text>
  <text x="673" y="153" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933">silence</text>
  <path class="grid" d="M610 130 V170"/>
  <text class="mut" x="610" y="186" font-size="12" text-anchor="middle">seuil : 10 à 100 Ω</text>
  <text class="mut" x="610" y="202" font-size="12" text-anchor="middle">selon l'appareil</text>
  <text class="fg" x="490" y="232" font-size="12.5">0,1 Ω · court-circuit franc</text>
  <text class="ok" x="736" y="232" font-size="12.5" text-anchor="end" font-weight="700">bip</text>
  <text class="fg" x="490" y="254" font-size="12.5">47 Ω · une résistance</text>
  <text class="warn" x="736" y="254" font-size="12.5" text-anchor="end" font-weight="700">bip aussi</text>
  <text class="fg" x="490" y="276" font-size="12.5">1 kΩ</text>
  <text class="mut" x="736" y="276" font-size="12.5" text-anchor="end" font-weight="700">silence</text>
  <circle class="mut" cx="292" cy="348" r="2.5"/>
  <text class="fg" x="302" y="352" font-size="12.5">Carte hors tension : le bipeur est un ohmmètre sur son petit calibre.</text>
  <circle class="mut" cx="292" cy="370" r="2.5"/>
  <text class="fg" x="302" y="374" font-size="12.5">Court-circuit ou faible résistance ? Lire la valeur en Ω.</text>
  <circle class="mut" cx="292" cy="392" r="2.5"/>
  <text class="fg" x="302" y="396" font-size="12.5">Un gros condensateur bipe brièvement puis se tait : il se charge.</text>
  <circle class="mut" cx="292" cy="414" r="2.5"/>
  <text class="fg" x="302" y="418" font-size="12.5">Un vrai court-circuit bipe dans les deux sens des pointes.</text>
</svg>
