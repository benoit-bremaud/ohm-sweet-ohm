  <path stroke="#dc2626" d="M291.6 141.2 L264.0 178.0" stroke-width="9" stroke-linecap="round"/>
  <path class="blk" stroke-width="4" fill="none" stroke-linecap="round" d="M120.0 363.0 V398 C120 442 262 446 264.0 328.0"/>
  <circle class="blkf" cx="120.0" cy="363.0" r="6.5"/>
  <path d="M300.0 280.0 L291.6 291.2" stroke="#aab2bd" stroke-width="3" stroke-linecap="round"/>
