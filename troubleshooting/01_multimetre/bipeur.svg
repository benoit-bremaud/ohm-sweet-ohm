    <text x="45" y="268" font-size="8" text-anchor="middle" fill="#aeb6c2">10A</text>
    <circle cx="45" cy="283" r="8" fill="#0c0e11" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="268" font-size="8" text-anchor="middle" fill="#aeb6c2">COM</text>
    <circle cx="90" cy="283" r="8" fill="#0c0e11" stroke="#9aa7b4" stroke-width="2"/>
    <text x="135" y="268" font-size="8" text-anchor="middle" fill="#aeb6c2">VΩ</text>
    <circle cx="135" cy="283" r="8" fill="#0c0e11" stroke="#dc2626" stroke-width="2"/>
  </g>
  <rect x="282" y="104" width="178" height="202" rx="6" fill="#1f7a4d"/>
  <path d="M300 130 H420 V280 H300" fill="none" stroke="#d4a017" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="300" cy="130" r="10" fill="#d4a017"/><circle cx="300" cy="130" r="3.5" fill="#0d3b26"/>
  <circle cx="300" cy="280" r="10" fill="#d4a017"/><circle cx="300" cy="280" r="3.5" fill="#0d3b26"/>
  <text x="372" y="210" font-size="11" text-anchor="middle" fill="#ffffff">piste</text>
  <path stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" d="M165.0 363.0 V395 C165 425 232 425 236 340 C240 260 235 215 264.0 178.0"/>
  <circle fill="#dc2626" cx="165.0" cy="363.0" r="6.5"/>
