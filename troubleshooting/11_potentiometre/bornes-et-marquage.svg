  <text x="250.0" y="309.2" font-size="16.8" font-weight="700" text-anchor="middle" fill="#1f2933">2</text>
  <rect x="284.9" y="272.2" width="22.7" height="63.0" rx="2" fill="#c9d0d9" stroke="#7d8794"/>
  <text x="296.2" y="309.2" font-size="16.8" font-weight="700" text-anchor="middle" fill="#1f2933">3</text>
