  <text class="blue" x="520" y="200" font-size="13" font-weight="700">50 kΩ, loi logarithmique</text>
  <text class="mut" x="520" y="217" font-size="12">réglage de volume</text>
  <rect x="430" y="248" width="76" height="34" rx="5" fill="#20242b" stroke="#7d8794"/>
  <text x="468" y="271" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffffff">103</text>
  <text class="blue" x="520" y="262" font-size="13" font-weight="700">10 × 10³ = 10 kΩ</text>
  <text class="mut" x="520" y="279" font-size="12">ajustable : code à 3 chiffres</text>
  <rect x="430" y="310" width="76" height="34" rx="5" fill="#20242b" stroke="#7d8794"/>
  <text x="468" y="333" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffffff">W103</text>
  <text class="blue" x="520" y="324" font-size="13" font-weight="700">10 kΩ, multitour</text>
  <text class="mut" x="520" y="341" font-size="12">25 tours de vis, sans butée franche</text>
  <text class="warn" x="430" y="388" font-size="12" font-weight="700">A et B ont changé de sens selon l'époque</text>
  <text class="warn" x="430" y="404" font-size="12" font-weight="700">et l'origine : vérifier à mi-course,</text>
  <text class="warn" x="430" y="420" font-size="12" font-weight="700">linéaire = la moitié du total.</text>
</svg>
