<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Bornes et marquage d'un potentiomètre</title>
  <desc id="d">À gauche, un potentiomètre rotatif vu côté axe, capot retiré : une piste résistive en arc relie la borne 1 à la borne 3, et un curseur, contact mobile porté par l'axe et relié à la borne 2 du milieu, glisse sur cette piste. Entre les bornes 1 et 3 se lit la résistance totale, fixe ; entre la borne 2 et chacune des deux autres, une résistance qui varie avec l'axe et dont la somme fait le total. À droite, quatre marquages : B10K, 10 kΩ à loi linéaire ; A50K, 50 kΩ à loi logarithmique pour un réglage de volume ; 103, ajustable de 10 kΩ ; W103, ajustable multitour de 10 kΩ, 25 tours de vis sans butée franche. Les lettres A et B ont changé de sens selon l'époque et l'origine : vérifier à mi-course, un modèle linéaire y lit la moitié du total.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="446" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Trois bornes : deux bouts de piste et un curseur</text>
  <text class="mut" x="24" y="60" font-size="14">Potentiomètre vu côté axe, capot retiré : le curseur glisse sur la piste résistive</text>
