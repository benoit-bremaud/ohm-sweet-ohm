  <title id="t">Mesure de la résistance totale d'un potentiomètre entre ses bornes extrêmes</title>
  <desc id="d">Un multimètre, sélecteur sur ohms calibre 20 kΩ, a une pointe sur la borne 1 et l'autre sur la borne 3 d'un potentiomètre marqué B10K ; il lit 9,62 kΩ. De 8 à 12 kΩ, soit la tolérance de 20 %, la piste est entière. OL : piste ou borne coupée. Bien au-dessus de 12 kΩ : piste brûlée ou usée. Tourner l'axe ne doit pas changer cette lecture.</desc>
