  <title id="t">Contrôle d'un fusible au bipeur, hors tension</title>
  <desc id="d">Deux multimètres, sélecteur sur le bipeur, ont une pointe sur chaque capsule d'un fusible, carte débranchée et déchargée. À gauche, fusible bon : l'appareil sonne en continu et lit 0,2 Ω, quelques dixièmes d'ohm pointes comprises. À droite, fusible fondu : pas de bip, l'appareil affiche OL, le circuit est ouvert ; chercher la cause avant de remplacer.</desc>
