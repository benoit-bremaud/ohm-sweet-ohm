  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Mesure de la tension de part et d'autre d'un fusible sous tension</title>
  <desc id="d">Deux multimètres, sélecteur sur volts continus, ont leur pointe noire à la masse. À gauche, la pointe rouge touche la capsule côté alimentation, en amont du fusible : l'appareil lit 12,03 V, le rail est présent. À droite, la pointe rouge touche la capsule côté charge, en aval : l'appareil lit 0,00 V. Une tension en amont et rien en aval : le fusible est ouvert. La même tension des deux côtés signifierait que le fusible conduit et qu'il faut chercher ailleurs. Un fusible ne fond pas sans raison : chercher le court-circuit en aval avant de remettre sous tension.</desc>
