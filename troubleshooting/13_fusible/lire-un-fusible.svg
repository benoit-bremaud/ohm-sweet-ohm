<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Lire le marquage et l'état d'un fusible en verre</title>
  <desc id="d">En haut, un fusible cartouche en verre dont les capsules portent le marquage T2AL250V. T : temporisé, F voudrait dire rapide. 2A : courant assigné, 2 A en permanence. L : faible pouvoir de coupure, H voudrait dire élevé, souvent avec un corps céramique. 250V : tension assignée, la tension maximale à couper. En bas, trois états visibles à travers le verre : fil entier, à confirmer au bipeur ; fil fondu net, signe d'une surcharge lente ; verre noirci, signe d'un court-circuit franc en aval. Sur un corps céramique, un fusible CMS ou une résistance fusible, rien ne se voit de l'extérieur : seule la mesure tranche.</desc>
