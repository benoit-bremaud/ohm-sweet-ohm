<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Capacité d'un condensateur céramique de classe II en fonction de la tension continue</title>
  <desc id="d">Graphique de la capacité restante, en pourcentage, en fonction de la tension continue aux bornes, de 0 à 16 V, pour un condensateur céramique 4,7 µF 16 V : allure typique, les valeurs exactes sont dans les courbes du fabricant. La courbe de la classe I (C0G, NP0) reste à 100 % : elle est stable, mais n'existe qu'en petites valeurs. La courbe d'un 4,7 µF 16 V de classe II (X7R) en boîtier 1206 descend à 73 % à 12 V, soit 3,4 µF. La courbe de la même valeur en boîtier 0805 descend bien plus vite : 33 % à 12 V, soit 1,5 µF. Repère 1, à 0 V : le capacimètre mesure presque sans tension, sa lecture est proche du marquage. Repère 2, à 12 V : il reste un tiers, un condensateur marqué 4,7 µF ne vaut plus que 1,5 µF sur un rail 12 V. Ce n'est pas une panne : c'est le comportement normal de la classe II (X5R, X7R, Y5V). Un condensateur de remplacement se choisit donc à boîtier et tension nominale au moins égaux.</desc>
