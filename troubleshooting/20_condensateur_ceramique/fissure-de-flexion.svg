  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Fissure de flexion d'un condensateur céramique CMS</title>
  <desc id="d">À gauche, vue en coupe : un condensateur céramique CMS est soudé par ses deux extrémités sur une carte qui fléchit. La céramique ne plie pas : la soudure tire sur ses extrémités et le corps se fend, en oblique, à partir du bord d'une terminaison, côté carte. La fissure relie des électrodes internes de polarités opposées : une fuite apparaît, puis un court-circuit, parfois des semaines après le choc. À droite, vue de dessus d'une carte : les condensateurs à contrôler en premier, cerclés de rouge, sont près d'une vis de fixation, d'un connecteur ou d'un bord détouré ; celui du milieu de la carte, cerclé de vert, est peu exposé. Plus le boîtier est long, 1206 et au-delà, plus il casse facilement. Après une chute, une torsion ou un vissage de travers, soupçonner les MLCC avant tout le reste.</desc>
