<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Lire le marquage d'un condensateur céramique</title>
  <desc id="d">En haut, quatre condensateurs céramique CMS (MLCC) de tailles croissantes, dessinés à la même échelle : 0402 (1,0 × 0,5 mm), 0603 (1,6 × 0,8 mm), 0805 (2,0 × 1,25 mm) et 1206 (3,2 × 1,6 mm). Leur corps beige ou brun, terminé par deux extrémités métallisées, ne porte aucun marquage : la valeur se lit sur le schéma ou se mesure, composant dessoudé. En bas, un condensateur céramique traversant en forme de disque porte le code 104K. Les deux premiers chiffres, 10, sont les chiffres significatifs ; le troisième, 4, est le nombre de zéros, en picofarads ; la lettre K donne la tolérance, ±10 % (J : ±5 %, M : ±20 %). 104 se lit donc 10 suivi de 4 zéros, soit 100 000 pF, 100 nF ou 0,1 µF. Autres codes courants : 103 pour 10 nF, 223 pour 22 nF, 105 pour 1 µF ; le nombre 47 seul vaut 47 pF.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
