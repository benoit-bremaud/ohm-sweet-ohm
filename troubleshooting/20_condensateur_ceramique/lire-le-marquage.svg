  <text class="mut" x="24" y="60" font-size="14">Un MLCC CMS ne porte aucun marquage ; un céramique traversant porte un code à trois chiffres</text>
  <text class="fg" x="24" y="100" font-size="15" font-weight="700">CMS (MLCC) : rien d'écrit, seule la taille se lit</text>
