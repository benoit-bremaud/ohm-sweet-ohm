  <text class="blue" x="384" y="366" font-size="13" font-weight="700">nombre de zéros</text>
  <text class="mut" x="384" y="383" font-size="12">ici 0000, en picofarads</text>
  <rect x="568" y="312" width="60" height="34" rx="5" fill="#20242b" stroke="#7d8794"/>
  <text x="598" y="335" font-size="17" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffffff">K</text>
  <text class="blue" x="568" y="366" font-size="13" font-weight="700">tolérance ±10 %</text>
