<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Mesurer la chute de tension aux bornes d'un fusible sous tension</title>
  <desc id="d">Un multimètre, sélecteur sur volts continus, a sa pointe rouge côté alimentation et sa pointe noire côté charge d'un fusible parcouru par le courant. Il lit 0,012 V. Quelques millivolts à quelques dizaines de millivolts : contact ou fusible sain ; plusieurs centaines de millivolts : contact résistant ou fusible fatigué ; toute la tension d'alimentation : ouvert.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}
    }
  </style>
  <rect class="bg" width="760" height="470" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Sous tension : la chute de tension aux bornes d'un contact</text>
  <text class="mut" x="24" y="60" font-size="14">Sélecteur sur V continu, carte alimentée par une alimentation limitée en courant</text>
  <g transform="translate(30 80) scale(1)">
    <rect width="180" height="310" rx="24" fill="#f2a900"/>
    <rect x="3" y="3" width="174" height="304" rx="22" fill="none" stroke="#c58700" stroke-width="2"/>
    <rect x="11" y="11" width="158" height="288" rx="15" fill="#2a2e35"/>
    <rect x="24" y="24" width="132" height="54" rx="6" fill="#c9d6b0" stroke="#11151a" stroke-width="2"/>
    <text x="120" y="63" font-size="28" font-weight="700" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1a2016">0.012</text>
    <text x="125" y="63" font-size="14" font-weight="700" fill="#1a2016">V</text>
    <path d="M159.9 177.3 A71 71 0 0 1 20.1 177.3" fill="none" stroke="#6b7482" stroke-width="1.5"/>
    <text x="90" y="252" font-size="13" font-weight="700" text-anchor="middle" fill="#aeb6c2">Ω</text>
    <path d="M90.0 128.0 L90.0 122.0" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="90.0" y="113.0" font-size="9.5" text-anchor="middle" fill="#aeb6c2">OFF</text>
    <path d="M111.7 135.1 L115.3 130.2" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="122.9" y="123.7" font-size="9.5" text-anchor="middle" fill="#aeb6c2">V~</text>
    <path d="M125.2 153.6 L130.9 151.7" stroke="#ffd54a" stroke-width="3" stroke-linecap="round"/>
    <text x="138.3" y="151.7" font-size="12" text-anchor="middle" font-weight="700" fill="#ffd54a">V</text>
    <path d="M144.3 144.7 h9 M144.3 148.7 h2 m1.5 0 h2 m1.5 0 h2" stroke="#ffd54a" stroke-width="1.3" fill="none"/>
    <path d="M125.2 176.4 L130.9 178.3" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="143.3" y="186.3" font-size="9.5" text-anchor="middle" fill="#aeb6c2">2M</text>
    <path d="M111.7 194.9 L115.3 199.8" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="122.9" y="214.3" font-size="9.5" text-anchor="middle" fill="#aeb6c2">200k</text>
    <path d="M90.0 202.0 L90.0 208.0" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="90.0" y="225.0" font-size="9.5" text-anchor="middle" fill="#aeb6c2">20k</text>
    <path d="M68.3 194.9 L64.7 199.8" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="57.1" y="214.3" font-size="9.5" text-anchor="middle" fill="#aeb6c2">2k</text>
    <path d="M54.8 176.4 L49.1 178.3" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="36.7" y="186.3" font-size="9.5" text-anchor="middle" fill="#aeb6c2">200</text>
    <path d="M54.8 153.6 L49.1 151.7" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M28.7 147.7 h14 M32.7 143.7 v8 l7 -4 z M39.7 143.7 v8" stroke="#aeb6c2" stroke-width="1.3" fill="#aeb6c2"/>
    <path d="M68.3 135.1 L64.7 130.2" stroke="#aeb6c2" stroke-width="1.5" stroke-linecap="round"/>
    <text x="52.1" y="123.7" font-size="9.5" text-anchor="middle" fill="#aeb6c2">A</text>
    <path d="M58.1 116.7 h9 M58.1 120.7 h2 m1.5 0 h2 m1.5 0 h2" stroke="#aeb6c2" stroke-width="1.3" fill="none"/>
    <circle cx="90" cy="165" r="34" fill="#3b4049" stroke="#16191e" stroke-width="2"/>
    <g transform="rotate(72 90 165)"><rect x="82" y="132" width="16" height="66" rx="8" fill="#555c68"/><path d="M90 137 V157" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/></g>
    <text x="45" y="268" font-size="8" text-anchor="middle" fill="#aeb6c2">10A</text>
    <circle cx="45" cy="283" r="8" fill="#0c0e11" stroke="#6b7482" stroke-width="2"/>
    <text x="90" y="268" font-size="8" text-anchor="middle" fill="#aeb6c2">COM</text>
    <circle cx="90" cy="283" r="8" fill="#0c0e11" stroke="#9aa7b4" stroke-width="2"/>
    <text x="135" y="268" font-size="8" text-anchor="middle" fill="#aeb6c2">VΩ</text>
    <circle cx="135" cy="283" r="8" fill="#0c0e11" stroke="#dc2626" stroke-width="2"/>
  </g>
  <rect x="300" y="85" width="14" height="14" rx="3" fill="#16a34a"/>
  <text class="fg" x="322" y="96" font-size="13">quelques mV à dizaines de mV : sain (plus pour un fusible PTC)</text>
  <rect x="300" y="107" width="14" height="14" rx="3" fill="#f59e0b"/>
  <text class="fg" x="322" y="118" font-size="13">plusieurs centaines de mV : contact résistant, fusible fatigué</text>
  <rect x="300" y="129" width="14" height="14" rx="3" fill="#dc2626"/>
  <text class="fg" x="322" y="140" font-size="13">toute la tension d'alimentation : ouvert</text>
  <rect class="panel" x="300" y="200" width="90" height="80" rx="8" stroke-width="1.5"/>
  <text class="fg" x="345" y="234" font-size="13" text-anchor="middle" font-weight="700">Alim. 12 V</text>
  <text class="mut" x="345" y="252" font-size="11" text-anchor="middle">limitée</text>
  <text class="mut" x="345" y="266" font-size="11" text-anchor="middle">en courant</text>
  <rect class="panel" x="640" y="200" width="90" height="80" rx="8" stroke-width="1.5"/>
  <text class="fg" x="685" y="245" font-size="13" text-anchor="middle" font-weight="700">Charge</text>
  <path class="wire" d="M390 240 H470 M550 240 H640"/>
  <rect x="470" y="229" width="80" height="22" rx="5" fill="#dbeafe" fill-opacity="0.55" stroke="#8b949e"/>
  <path d="M482 240 C500 233 520 247 538 240" stroke="#6b7482" stroke-width="1.5" fill="none"/>
  <rect x="466" y="227" width="16" height="26" rx="3" fill="#c9d0d9" stroke="#8b949e"/><rect x="538" y="227" width="16" height="26" rx="3" fill="#c9d0d9" stroke="#8b949e"/>
  <text class="fg" x="510" y="218" font-size="13" text-anchor="middle" font-weight="700">fusible</text>
  <path class="flow fb" d="M398 231 H458 M562 231 H632"/>
  <text class="blue" x="428" y="222" font-size="12" text-anchor="middle" font-weight="700">I →</text>
  <text class="blue" x="597" y="222" font-size="12" text-anchor="middle" font-weight="700">I →</text>
  <path stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" d="M165.0 363.0 V394 C165 430 436.1 440 436.1 297.0"/>
  <circle fill="#dc2626" cx="165.0" cy="363.0" r="6.5"/>
  <path d="M460.0 242.0 L454.4 254.8" stroke="#aab2bd" stroke-width="3" stroke-linecap="round"/>
  <path stroke="#dc2626" d="M454.4 254.8 L436.1 297.0" stroke-width="9" stroke-linecap="round"/>
  <path class="blk" stroke-width="4" fill="none" stroke-linecap="round" d="M120.0 363.0 V398 C120 462 583.9 470 583.9 297.0"/>
  <circle class="blkf" cx="120.0" cy="363.0" r="6.5"/>
  <path d="M560.0 242.0 L565.6 254.8" stroke="#aab2bd" stroke-width="3" stroke-linecap="round"/>
  <path class="blk" d="M565.6 254.8 L583.9 297.0" stroke-width="9" stroke-linecap="round"/>
  <text class="no" x="444" y="262" font-size="16" text-anchor="end" font-weight="700">+</text>
  <text class="fg" x="578" y="262" font-size="16" font-weight="700">−</text>
  <text class="mut" x="612" y="330" font-size="12">Les chemins parallèles</text>
  <text class="mut" x="612" y="346" font-size="12">ne gênent pas : on lit</text>
  <text class="mut" x="612" y="362" font-size="12">la tension réelle.</text>
</svg>
