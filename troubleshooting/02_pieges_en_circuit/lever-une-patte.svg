  <title id="t">Lever une patte pour isoler un composant</title>
  <desc id="d">Vue de côté d'une résistance traversante de 10 kΩ, multimètre sur ohms calibre 20 kΩ. À gauche, les deux pattes sont soudées : l'appareil lit 3,2 kΩ, la résistance en parallèle avec le reste du circuit. À droite, la patte côté signal est dessoudée et soulevée, la patte côté plan de masse reste soudée ; pointes sur les pattes et non sur les pastilles, l'appareil lit 10 kΩ, la résistance seule.</desc>
