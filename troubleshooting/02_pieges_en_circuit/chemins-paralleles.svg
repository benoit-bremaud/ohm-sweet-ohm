  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Chemins parallèles : l'ohmmètre mesure le nœud</title>
  <desc id="d">Un multimètre, sélecteur sur ohms calibre 20 kΩ, mesure une résistance R1 de 10 kΩ soudée. Une résistance R2 de 10 kΩ relie les mêmes nœuds : le courant de test se partage et l'appareil lit 5 kΩ. Une jonction relie aussi les deux nœuds ; elle est bloquée dans ce sens des pointes, pointe rouge sur sa cathode, et conduirait pointes inversées. Échelle de lecture : en dessous de la nominale, rien de prouvé ; dans la tolérance, probablement saine ; au-dessus, défectueuse.</desc>
