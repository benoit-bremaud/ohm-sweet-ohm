  <text class="mut" x="630" y="268" font-size="12" text-anchor="middle">une prise au milieu du bobinage :</text>
  <text class="mut" x="630" y="285" font-size="12" text-anchor="middle">deux moitiés égales</text>
  <text class="mut" x="380" y="330" font-size="12" text-anchor="middle">Un transformateur ne transmet que l'alternatif : à l'ohmmètre, chaque bobinage n'est qu'un fil.</text>
