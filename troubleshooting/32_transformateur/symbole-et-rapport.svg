  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Transformateur : deux bobinages isolés sur un même noyau</text>
  <text class="mut" x="24" y="60" font-size="14">La tension suit le nombre de spires ; rien ne passe en continu d'un bobinage à l'autre</text>
