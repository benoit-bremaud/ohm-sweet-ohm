  <text class="mut" x="380" y="268" font-size="12" text-anchor="middle">2 fois moins de spires au secondaire :</text>
  <text class="mut" x="380" y="285" font-size="12" text-anchor="middle">2 fois moins de tension</text>
  <text class="mut" x="696" y="188" font-size="12">point</text>
