<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Contrôler un transformateur à l'ohmmètre</title>
  <desc id="d">Deux mesures côte à côte sur un petit transformateur à quatre broches, dessoudé, bobinage primaire P en haut et secondaire S en bas. À gauche, multimètre sur le calibre 200 ohms, une pointe sur chaque broche du primaire : 0,8 ohm, le bobinage est continu ; OL signifierait un bobinage coupé. La mesure se refait sur chaque bobinage. À droite, multimètre sur le calibre 2 mégohms, une pointe sur le primaire et l'autre sur le secondaire : OL, les bobinages sont isolés ; toute continuité entre deux bobinages séparés est un défaut. L'ohmmètre trouve la coupure et le court-circuit entre bobinages, pas les spires en court-circuit : voir la fiche 30.</desc>
