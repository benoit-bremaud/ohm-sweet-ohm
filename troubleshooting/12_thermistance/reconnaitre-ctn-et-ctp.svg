<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Reconnaître une thermistance CTN ou CTP</title>
  <desc id="d">À gauche, trois boîtiers. La CTN de mesure : une perle d'époxy, parfois au bout de deux fils, marquée 103 ou non marquée, 10 kΩ à 25 °C. La CTN de puissance : un disque noir ou vert en série avec une entrée d'alimentation (côté secteur : hors périmètre), marqué 5D-11, soit 5 Ω à 25 °C et un disque de 11 mm. La CTP polymère, ou fusible réarmable : une pastille jaune ou un boîtier CMS, d'une fraction d'ohm à quelques ohms à froid. À droite, l'allure de la résistance selon la température : celle de la CTN baisse régulièrement quand la température monte ; celle de la CTP reste presque nulle à froid, puis bondit au-delà de sa température de basculement.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="470" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">CTN ou CTP : le sens de variation fait la famille</text>
  <text class="mut" x="24" y="60" font-size="14">Trois boîtiers courants sur une carte, et l'allure de leur résistance quand la température monte</text>
  <path class="grid" d="M410 84 V452"/>
  <text class="fg" x="24" y="100" font-size="15" font-weight="700">Les reconnaître</text>
  <path stroke="#aab2bd" stroke-width="4" fill="none" stroke-linecap="round" d="M59 138 L49 182 M69 138 L79 182"/>
  <ellipse cx="64" cy="138" rx="13" ry="16" fill="#2f3640" stroke="#11151a" stroke-width="1.5"/>
  <ellipse cx="60" cy="132" rx="3" ry="5" fill="#ffffff" fill-opacity="0.18"/>
  <text class="blue" x="120" y="136" font-size="14" font-weight="700">CTN de mesure</text>
  <text class="mut" x="120" y="154" font-size="12">perle d'époxy, parfois au bout de deux fils</text>
  <text class="mut" x="120" y="170" font-size="12">marquée 103 ou non marquée : 10 kΩ à 25 °C</text>
  <path stroke="#aab2bd" stroke-width="4" fill="none" stroke-linecap="round" d="M54 250 V299.0 M74 250 V299.0"/>
  <rect x="37.0" y="223.0" width="54" height="54" rx="27" fill="#1f5f43" stroke="#123a29" stroke-width="1.5"/>
  <text x="64" y="255" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#ffffff">5D-11</text>
  <text class="blue" x="120" y="240" font-size="14" font-weight="700">CTN de puissance</text>
  <text class="mut" x="120" y="258" font-size="12">disque de 11 mm en série avec une entrée</text>
  <text class="mut" x="120" y="274" font-size="12">5D-11 : 5 Ω à 25 °C ; secteur : hors périmètre</text>
  <path stroke="#aab2bd" stroke-width="4" fill="none" stroke-linecap="round" d="M54 368 V410.0 M74 368 V410.0"/>
  <rect x="41.0" y="348.0" width="46" height="40" rx="5" fill="#e3b23c" stroke="#9a7416" stroke-width="1.5"/>
  <text class="amber" x="120" y="358" font-size="14" font-weight="700">CTP polymère</text>
  <text class="mut" x="120" y="376" font-size="12">fusible réarmable, pastille jaune ou boîtier CMS</text>
  <text class="mut" x="120" y="392" font-size="12">à froid : d'une fraction d'ohm à quelques ohms</text>
  <text class="fg" x="430" y="100" font-size="15" font-weight="700">Résistance selon la température</text>
  <path class="wire" stroke-width="1.5" d="M450 126 V330 H730"/>
  <text class="mut" x="444" y="134" font-size="12" text-anchor="end">Ω</text>
  <text class="mut" x="730" y="348" font-size="12" text-anchor="end">température →</text>
  <path d="M458 140 C510 262 610 300 724 312" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <path d="M458 316 H612 C650 314 664 250 672 140" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round"/>
  <text class="blue" x="500" y="188" font-size="13" font-weight="700">CTN</text>
  <text class="amber" x="684" y="170" font-size="13" font-weight="700">CTP</text>
  <text class="blue" x="430" y="382" font-size="13" font-weight="700">CTN : la résistance baisse quand ça chauffe.</text>
  <text class="amber" x="430" y="404" font-size="13" font-weight="700">CTP : presque rien à froid, puis elle bondit</text>
  <text class="amber" x="430" y="422" font-size="13" font-weight="700">au-delà de sa température de basculement.</text>
</svg>
