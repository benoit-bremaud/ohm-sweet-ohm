<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Ondulation d'un rail filtré par un condensateur électrolytique sain ou usé</title>
  <desc id="d">Graphique de la tension d'un rail 12 V en fonction du temps, sur 40 millisecondes, derrière un redresseur alimenté en 50 Hz : le condensateur de filtrage est rechargé 100 fois par seconde, toutes les 10 millisecondes. Avec un condensateur sain, la tension dessine de petites dents de scie entre 12 V et 11,6 V : ondulation faible, 0,4 V. Avec un condensateur usé, elle plonge de 12 V à 8,5 V entre deux recharges : des creux de 3,5 V à chaque période. Entre deux recharges, le condensateur alimente seul la carte ; usé, il se vide trop vite, ce qui donne un régulateur qui décroche, un ronflement, des redémarrages. Le voltmètre en continu n'affiche que la moyenne : il ne voit pas les creux.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
