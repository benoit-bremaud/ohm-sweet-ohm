<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Indices visuels d'un condensateur électrolytique défaillant</title>
  <desc id="d">Quatre condensateurs électrolytiques radiaux soudés sur une carte, vus de côté. Le premier a un aspect normal : dessus plat, pied propre. Le deuxième a le dessus bombé : la pression interne a monté. Le troisième porte un dépôt brun ou roux sur le dessus : l'électrolyte est sorti. Le quatrième a le fond repoussé : le bouchon de caoutchouc sort du boîtier, qui s'est soulevé de la carte. Les trois derniers sont à remplacer. Un aspect normal n'innocente pas : un condensateur dont l'ESR a monté ne montre souvent rien. Une colle brune ou noire au pied d'un condensateur sert à le tenir : ce n'est pas de l'électrolyte.</desc>
