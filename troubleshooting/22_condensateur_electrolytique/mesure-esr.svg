<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Mesure de l'ESR d'un condensateur électrolytique en circuit</title>
  <desc id="d">Deux ESR-mètres, pinces sur les deux pattes d'un condensateur électrolytique 470 µF 25 V laissé en place sur sa carte, hors tension et déchargé ; l'appareil mesure la résistance série du condensateur en alternatif. À gauche, condensateur sain : 0,09 Ω, une fraction d'ohm, comme un condensateur neuf de même valeur. À droite, condensateur usé : 4,7 Ω, à remplacer, alors que sa capacité peut encore être bonne. La référence est un condensateur neuf identique, ou la valeur de sa fiche technique. Un condensateur en court-circuit lit lui aussi une ESR très basse : le bipeur le dit. Une faible résistance en parallèle sur la carte fausse la lecture vers le bas.</desc>
