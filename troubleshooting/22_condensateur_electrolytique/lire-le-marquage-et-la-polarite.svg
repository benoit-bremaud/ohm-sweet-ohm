  <title id="t">Lire le marquage et la polarité d'un condensateur électrolytique</title>
  <desc id="d">À gauche, un condensateur électrolytique radial vu de côté, marqué 470 µF, 25 V et 105 °C : une bande claire portant des signes moins court le long du boîtier du côté de la patte négative, qui est aussi la plus courte sur un composant neuf ; l'autre patte est le plus. À droite, un condensateur électrolytique CMS vu de dessus, marqué 470 et 25 V : un secteur noir sur le dessus du boîtier repère le côté négatif. En bas, les trois indications à relever : la capacité en microfarads, la tension maximale de service à ne jamais dépasser, et la température maximale, 85 °C ou 105 °C le plus souvent. Monté à l'envers, le condensateur chauffe, gonfle et peut s'ouvrir brutalement : vérifier deux fois le sens avant de souder.</desc>
