  <title id="t">Alimentation de laboratoire limitée en courant : carte saine et carte en court-circuit</title>
  <desc id="d">Deux alimentations de laboratoire réglées à 5 V avec une limite de courant de 100 mA. À gauche, carte saine : l'afficheur indique 5,00 V et 0,080 A, le voyant CV (tension constante) est allumé. À droite, carte en court-circuit : la limite agit, l'afficheur indique 0,21 V et 0,100 A, le voyant CC (courant constant) est allumé ; la tension s'effondre au lieu de brûler une piste.</desc>
