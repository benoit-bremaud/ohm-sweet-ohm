  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Décharger un condensateur dans une résistance, puis vérifier</text>
  <text class="mut" x="24" y="60" font-size="14">Exemple : 1000 µF chargé à 35 V, résistance de 1 kΩ 5 W : 35 mA au départ, 5 s environ</text>
