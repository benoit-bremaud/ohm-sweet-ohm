  <text class="mut" x="24" y="60" font-size="14">Aucune polarité : il se monte dans les deux sens. La tension marquée est la tension maximale de service</text>
  <text class="fg" x="24" y="100" font-size="15" font-weight="700">Trois présentations courantes</text>
