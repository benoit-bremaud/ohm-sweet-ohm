  <text class="fg" x="24" y="420" font-size="14" font-weight="700">474 : 47 suivi de 4 zéros = 470 000 pF = 470 nF = 0,47 µF</text>
  <text class="mut" x="24" y="442" font-size="12">Notation avec lettre : la lettre remplace la virgule, qui s'efface trop facilement. n47 = 0,47 nF ; 4n7 = 4,7 nF ; 47n = 47 nF.</text>
  <text class="mut" x="24" y="460" font-size="12">Tension : en volts continus, sauf si elle est suivie du signe ~ ou de « AC » (tension alternative).</text>
