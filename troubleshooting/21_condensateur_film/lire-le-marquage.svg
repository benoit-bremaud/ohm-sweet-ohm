  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Lire le marquage d'un condensateur film</title>
  <desc id="d">En haut, trois présentations courantes du condensateur film, toutes sans polarité : un boîtier rectangulaire rouge marqué en clair 0,47 µF J 100 V ; un modèle enrobé vert marqué du code 474J 100V ; un modèle axial jaune marqué 47n 63V. En bas, le décodage de 474J : les deux premiers chiffres, 47, sont les chiffres significatifs ; le troisième, 4, est le nombre de zéros, en picofarads ; la lettre J donne la tolérance, ±5 % (K : ±10 %, M : ±20 %). 474 se lit donc 47 suivi de 4 zéros, soit 470 000 pF, 470 nF ou 0,47 µF. Dans la notation avec lettre, la lettre remplace la virgule, qui s'efface trop facilement : n47 vaut 0,47 nF, 4n7 vaut 4,7 nF et 47n vaut 47 nF. La tension est donnée en volts continus, sauf si elle est suivie du signe tilde ou de la mention AC, qui indiquent une tension alternative.</desc>
