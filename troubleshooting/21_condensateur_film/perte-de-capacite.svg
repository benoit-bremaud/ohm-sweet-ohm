<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Auto-cicatrisation et perte de capacité d'un condensateur film métallisé</title>
  <desc id="d">À gauche, trois coupes d'un film métallisé, une couche de métal très mince de chaque côté d'un film plastique isolant. Étape 1 : un point faible du film claque, une étincelle le traverse sous la tension. Étape 2 : le métal de l'armature s'évapore tout autour de l'étincelle. Étape 3 : le défaut est isolé ; il n'y a plus de court-circuit, mais un peu d'armature en moins. À droite, deux armatures vues de dessus : celle d'un condensateur neuf, intacte, 470 nF ; celle d'un condensateur usé, criblée de cicatrices, 310 nF. Chaque cicatrice retire un peu de surface. Quelques milliers ne coûtent pas 1 % de capacité : il en faut bien plus pour arriver là, et rien ne se voit. Cela arrive sur le secteur (classe X2, alimentation capacitive) : l'air ionisé multiplie les claquages et la perte devient forte en un ou deux ans ; ce cas est hors périmètre de ces fiches.</desc>
