  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Symbole et contacts d'un relais</title>
  <desc id="d">Trois schémas d'un relais à contact inverseur : une bobine entre les bornes A1 et A2, et un contact à trois bornes, commun COM, repos NC, travail NO. À gauche, au repos : le commun touche le contact de repos. Au centre, bobine alimentée : le commun passe sur le contact de travail. À droite, une diode de roue libre en parallèle sur la bobine, bague du côté du plus : elle absorbe la surtension à la coupure. Les noms des bornes et leur position se lisent sur la fiche technique du relais.</desc>
