  <text class="mut" x="630" y="293" font-size="12" text-anchor="middle">elle absorbe la surtension à la coupure</text>
  <text class="mut" x="380" y="330" font-size="12" text-anchor="middle">Les noms des bornes (A1, A2, COM, NC, NO) et leur position se lisent sur la fiche technique du relais.</text>
