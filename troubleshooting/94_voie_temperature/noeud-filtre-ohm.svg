  <title id="t">Lecture d'ohmmètre qui monte sur un nœud filtré par un condensateur</title>
  <desc id="d">Carte hors tension, multimètre sur ohms calibre 2 kΩ entre la broche b et la masse. Le condensateur de filtrage se charge d'abord par le courant de l'ohmmètre : la lecture part de zéro et monte pendant quelques secondes, 0,86 kΩ après 3 s, puis se stabilise à 995 Ω. Une courbe montre cette montée sur 8 s. Lire la valeur stable, inverser les pointes et relire, comme sur la voie jumelle.</desc>
