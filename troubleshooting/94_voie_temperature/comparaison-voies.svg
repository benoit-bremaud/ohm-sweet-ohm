<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 510" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Tableau de comparaison de quatre voies jumelles : la voie intruse</title>
  <desc id="d">Sur une carte déposée, hors tension, la résistance de la broche b à la masse est mesurée sur quatre voies identiques : TEMP 1 995 Ω, TEMP 2 1 071 Ω, TEMP 3 1 000 Ω, TEMP 4 1 025 Ω. TEMP 1 et TEMP 2 sont les deux sondes du même tuyau et doivent lire pareil ; leur écart de 76 Ω vaut environ 20 °C de PT1000. TEMP 2 est l'intruse. TEMP 4, 2,5 % au-dessus de 1 000 Ω, est un second suspect à relire après la réparation. En circuit l'ohmmètre voit aussi les chemins en parallèle : mesurer dans les deux sens et comparer sens par sens.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="510" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Comparer les voies jumelles : l'intruse désigne la panne</text>
  <text class="mut" x="24" y="60" font-size="14">Carte déposée, hors tension : la même mesure, broche b → masse, sur chaque voie identique</text>
  <rect class="ok" x="60" y="257.5" width="70" height="142.5" rx="4"/>
  <text class="ok" x="95" y="249.5" font-size="14" text-anchor="middle" font-weight="700">995 Ω</text>
  <text class="fg" x="95" y="420" font-size="13" text-anchor="middle" font-weight="700">TEMP 1</text>
  <rect class="no" x="180" y="143.5" width="70" height="256.5" rx="4"/>
  <text class="no" x="215" y="135.5" font-size="14" text-anchor="middle" font-weight="700">1 071 Ω</text>
  <text class="fg" x="215" y="420" font-size="13" text-anchor="middle" font-weight="700">TEMP 2</text>
  <rect class="ok" x="300" y="250.0" width="70" height="150.0" rx="4"/>
  <text class="ok" x="335" y="242.0" font-size="14" text-anchor="middle" font-weight="700">1 000 Ω</text>
  <text class="fg" x="335" y="420" font-size="13" text-anchor="middle" font-weight="700">TEMP 3</text>
  <rect class="ok" x="420" y="212.5" width="70" height="187.5" rx="4"/>
  <text class="ok" x="455" y="204.5" font-size="14" text-anchor="middle" font-weight="700">1 025 Ω</text>
  <text class="fg" x="455" y="420" font-size="13" text-anchor="middle" font-weight="700">TEMP 4</text>
  <path class="grid" d="M50 250.0 H540"/>
  <text class="mut" x="46" y="254.0" font-size="11" text-anchor="end">1 000</text>
  <text class="mut" x="50" y="444" font-size="11">Échelle à partir de 900 Ω</text>
  <text class="fg" x="570" y="120" font-size="15" font-weight="700">Lecture</text>
  <text class="fg" x="570" y="146" font-size="12" font-weight="400">TEMP 1 et TEMP 2 : même</text>
  <text class="fg" x="570" y="166" font-size="12" font-weight="400">tuyau, même lecture attendue.</text>
  <text class="no" x="570" y="186" font-size="12" font-weight="700">1 071 − 995 = 76 Ω</text>
  <text class="no" x="570" y="206" font-size="12" font-weight="700">≈ 20 °C de PT1000</text>
  <text class="no" x="570" y="226" font-size="12" font-weight="700">TEMP 2 : l'intruse.</text>
  <text class="mut" x="570" y="246" font-size="12" font-weight="400">TEMP 4 : +2,5 % sur 1 000 Ω,</text>
  <text class="mut" x="570" y="266" font-size="12" font-weight="400">second suspect, à relire</text>
