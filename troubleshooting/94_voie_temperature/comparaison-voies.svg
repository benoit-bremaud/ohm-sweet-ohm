  <text class="blue" x="380" y="470" font-size="14" text-anchor="middle" font-weight="700">Mesurer dans les deux sens, comparer sens par sens</text>
  <text class="mut" x="380" y="488" font-size="12" text-anchor="middle">en circuit, l'ohmmètre voit aussi les chemins en parallèle</text>
