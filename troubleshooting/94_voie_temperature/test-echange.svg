  <text class="fg" x="24" y="100" font-size="15" font-weight="700">Échanger les cartes filtre TFB1 ↔ TFB2</text>
  <rect class="panel" x="90" y="120" width="120" height="60" rx="8" stroke-width="1.5"/>
  <text class="fg" x="150" y="156" font-size="18" text-anchor="middle" font-weight="700">A</text>
