  <text class="fg" x="330" y="156" font-size="18" text-anchor="middle" font-weight="700">B</text>
  <path class="wire" d="M210 140 C230 120 250 120 270 140 M270 160 C250 180 230 180 210 160"/>
  <text class="mut" x="240" y="210" font-size="12" text-anchor="middle">échange</text>
  <text class="ok" x="440" y="136" font-size="13" font-weight="700">✓ Le défaut passe au tuyau 2</text>
  <text class="mut" x="456" y="154" font-size="12">la carte filtre est en cause</text>
  <text class="no" x="440" y="188" font-size="13" font-weight="700">✗ Le défaut reste sur le tuyau 1</text>
  <text class="mut" x="456" y="206" font-size="12">la carte de commande ou les sondes</text>
  <text class="fg" x="24" y="280" font-size="15" font-weight="700">Échanger les fiches TEMP 1 ↔ TEMP 2</text>
