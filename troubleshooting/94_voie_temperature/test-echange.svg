<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Test d'échange de deux cartes filtre et de deux fiches de sondes</title>
  <desc id="d">Hors tension et bracelet antistatique pour chaque échange ; relecture sur alimentation limitée en courant, élément chauffant débranché. Premier test : échanger les deux cartes filtre identiques TFB1 et TFB2, puis relire le code défaut. Si le défaut passe du tuyau 1 au tuyau 2, la carte filtre est en cause ; s'il reste sur le tuyau 1, chercher sur la carte de commande ou les sondes. Second test : échanger les fiches TEMP 1 et TEMP 2 sur la carte de commande, puis lire la température de chaque voie, pas le code : un défaut d'écart entre les deux reste le même. Si la température fausse suit la sonde, la sonde ou son câble est en cause ; si elle reste sur la voie, la voie de la carte est en cause, ici la résistance R25. Un seul échange à la fois, jamais sur une panne destructrice.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="500" rx="16"/>
