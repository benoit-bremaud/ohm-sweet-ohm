  <text class="fg" x="150" y="336" font-size="18" text-anchor="middle" font-weight="700">A</text>
  <rect class="panel" x="270" y="300" width="120" height="60" rx="8" stroke-width="1.5"/>
  <text class="fg" x="330" y="336" font-size="18" text-anchor="middle" font-weight="700">B</text>
  <path class="wire" d="M210 320 C230 300 250 300 270 320 M270 340 C250 360 230 360 210 340"/>
