<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Comment une dérive de 7 % de la résistance de référence devient 18 à 19 °C d'erreur</title>
  <desc id="d">Hypothèse de voie : la PT1000 entre les broches a et b, la résistance de référence R25 de b à la masse ; la broche a part vers le filtre, le multiplexeur et l'ADC. Sonde à 20 °C, environ 1 078 Ω. Si la carte lit la tension de a seule et retranche 1 000 Ω, la voie saine à 995 Ω lit environ −1 °C de trop et TEMP 2 à 1 071 Ω environ +18 °C : TEMP 2 lit chaud. Si la carte lit le rapport des deux résistances, cas le plus courant, la voie saine lit environ +1 °C et TEMP 2 environ −19 °C : TEMP 2 lit froid. Dans les deux cas l'écart d'environ 20 °C entre les deux sondes du tuyau déclenche le défaut d'écart. Le menu de service dit quel cas s'applique.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="500" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Une référence qui dérive de 7 % : 18 à 19 °C d'erreur</text>
  <text class="mut" x="24" y="60" font-size="14">Hypothèse de voie : PT1000 entre a et b, référence R25 de b à la masse ; le sens de l'erreur dépend de la lecture</text>
  <rect class="panel" x="90" y="90" width="120" height="44" rx="8" stroke-width="1.5"/>
  <text class="fg" x="150.0" y="117.0" font-size="13" text-anchor="middle" font-weight="700">Excitation</text>
  <path class="wire" d="M150 134 V170 M150 230 V270 M150 330 V350 M136 350 h28 M141 356 h18 M146 362 h8 M150 160 H280"/>
  <rect x="136" y="170" width="28" height="60" rx="4" fill="#8fbfe0" stroke="#3f6f96" stroke-width="1.5"/>
  <text class="blue" x="174" y="196" font-size="13" font-weight="700">PT1000</text>
  <text class="mut" x="174" y="212" font-size="11">sonde, entre a et b</text>
  <rect x="136" y="270" width="28" height="60" rx="4" fill="#d9b88c" stroke="#8a6d45" stroke-width="1.5"/>
  <text class="no" x="174" y="296" font-size="13" font-weight="700">R réf. (R25)</text>
  <text class="mut" x="174" y="312" font-size="11">1 000 Ω prévue</text>
  <text class="fg" x="128" y="164" font-size="13" text-anchor="end" font-weight="700">a</text>
  <text class="fg" x="128" y="254" font-size="13" text-anchor="end" font-weight="700">b</text>
  <text class="mut" x="174" y="254" font-size="11">b → réf. ADC si ratiométrique</text>
  <text class="mut" x="286" y="156" font-size="12">→ filtre,</text>
  <text class="mut" x="286" y="172" font-size="12">mux, ADC</text>
  <text class="fg" x="24" y="400" font-size="13" font-weight="700">Sonde à 20 °C ≈ 1 078 Ω</text>
  <text class="mut" x="24" y="420" font-size="12">Le menu de service dit quel cas : TEMP 2 lit-elle chaud ou froid ?</text>
  <text class="fg" x="400" y="110" font-size="14" font-weight="700">Source de courant, V(a) seule</text>
  <text class="mut" x="400" y="128" font-size="11">le logiciel retranche 1 000 Ω</text>
  <text class="ok" x="400" y="152" font-size="13" font-weight="700">voie saine, 995 Ω : −1 °C</text>
  <text class="no" x="400" y="172" font-size="13" font-weight="700">TEMP 2, 1 071 Ω : +18 °C</text>
  <text class="no" x="400" y="212" font-size="12" font-weight="700">TEMP 2 lit chaud ; écart ≈ 20 °C</text>
  <text class="fg" x="400" y="250" font-size="14" font-weight="700">Ratiométrique (le plus courant)</text>
  <text class="mut" x="400" y="268" font-size="11">rapport R PT1000 / R réf. (TI SBAA275A)</text>
  <text class="ok" x="400" y="292" font-size="13" font-weight="700">voie saine, 995 Ω : +1 °C</text>
  <text class="no" x="400" y="312" font-size="13" font-weight="700">TEMP 2, 1 071 Ω : −19 °C</text>
  <text class="no" x="400" y="352" font-size="12" font-weight="700">TEMP 2 lit froid ; écart ≈ 20 °C</text>
  <text class="mut" x="24" y="470" font-size="12">Dans les deux cas l'écart entre les sondes du tuyau déclenche le défaut d'écart : la dérive passe dans la lecture.</text>
