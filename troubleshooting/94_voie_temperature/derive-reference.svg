<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Comment une dérive de 7 % de la résistance de référence devient 18 °C d'erreur</title>
  <desc id="d">Hypothèse de voie : une source de courant traverse la PT1000, entre les broches a et b, puis la résistance de référence R25 vers la masse ; la broche a part vers le filtre, le multiplexeur et l'ADC. V(a) vaut I fois la somme des deux résistances, et le logiciel retranche 1 000 Ω pour la référence. Sonde à 20 °C, environ 1 078 Ω. Voie saine, référence à 995 Ω : erreur d'environ −1 °C. Voie TEMP 2, référence à 1 071 Ω : erreur d'environ +18 °C. L'écart de 76 Ω entre les deux sondes du même tuyau vaut environ 20 °C et déclenche le défaut d'écart de températures. Avec une lecture ratiométrique, en pont diviseur, l'erreur change de signe mais garde le même ordre de grandeur.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="500" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Une référence qui dérive de 7 % : 18 °C d'erreur</text>
  <text class="mut" x="24" y="60" font-size="14">Hypothèse de voie : source de courant, PT1000 puis référence vers la masse ; 20 °C d'écart entre jumelles</text>
  <rect class="panel" x="90" y="90" width="120" height="44" rx="8" stroke-width="1.5"/>
  <text class="fg" x="150.0" y="117.0" font-size="13" text-anchor="middle" font-weight="700">Source de courant</text>
  <path class="wire" d="M150 134 V170 M150 230 V270 M150 330 V350 M136 350 h28 M141 356 h18 M146 362 h8 M150 160 H280"/>
  <rect x="136" y="170" width="28" height="60" rx="4" fill="#8fbfe0" stroke="#3f6f96" stroke-width="1.5"/>
  <text class="blue" x="174" y="196" font-size="13" font-weight="700">PT1000</text>
  <text class="mut" x="174" y="212" font-size="11">sonde, entre a et b</text>
  <rect x="136" y="270" width="28" height="60" rx="4" fill="#d9b88c" stroke="#8a6d45" stroke-width="1.5"/>
  <text class="no" x="174" y="296" font-size="13" font-weight="700">R réf. (R25)</text>
  <text class="mut" x="174" y="312" font-size="11">1 000 Ω prévue</text>
  <text class="fg" x="128" y="164" font-size="13" text-anchor="end" font-weight="700">a</text>
  <text class="fg" x="128" y="254" font-size="13" text-anchor="end" font-weight="700">b</text>
  <text class="mut" x="286" y="156" font-size="12">→ filtre,</text>
  <text class="mut" x="286" y="172" font-size="12">mux, ADC</text>
  <text class="fg" x="24" y="400" font-size="13" font-weight="700">V(a) = I × (R PT1000 + R réf.)</text>
  <text class="mut" x="24" y="420" font-size="12">le logiciel retranche 1 000 Ω pour R réf.</text>
  <text class="fg" x="420" y="120" font-size="15" font-weight="700">Calcul, sonde à 20 °C (≈ 1 078 Ω)</text>
  <text class="fg" x="420" y="160" font-size="13" font-weight="700">Voie saine, R réf. = 995 Ω</text>
  <text class="mut" x="420" y="180" font-size="12">lue : 1 078 + (995 − 1 000) = 1 073 Ω</text>
  <text class="ok" x="420" y="200" font-size="14" font-weight="700">erreur ≈ −1 °C</text>
  <text class="fg" x="420" y="250" font-size="13" font-weight="700">Voie TEMP 2, R réf. = 1 071 Ω</text>
  <text class="mut" x="420" y="270" font-size="12">lue : 1 078 + (1 071 − 1 000) = 1 149 Ω</text>
  <text class="no" x="420" y="290" font-size="14" font-weight="700">erreur ≈ +18 °C</text>
  <text class="fg" x="420" y="360" font-size="13" font-weight="700">Écart entre les deux sondes du tuyau :</text>
  <text class="no" x="420" y="380" font-size="12" font-weight="700">76 Ω / 3,85 Ω par °C ≈ 20 °C → défaut d'écart</text>
  <text class="mut" x="24" y="470" font-size="12">Lecture ratiométrique (pont diviseur) : l'erreur change de signe, l'ordre de grandeur reste.</text>
</svg>
