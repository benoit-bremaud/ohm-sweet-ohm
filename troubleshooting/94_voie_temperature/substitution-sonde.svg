  <text class="mut" x="220" y="368" font-size="12" text-anchor="middle">suivre la voie jusqu'à l'ADC</text>
  <text class="mut" x="24" y="404" font-size="12">Essai bref, élément chauffant débranché : la protection thermique est neutralisée pendant l'essai.</text>
