  <title id="t">Substitution d'une sonde PT1000 par une résistance connue</title>
  <desc id="d">Une résistance de 1 000 Ω à 0,1 % est branchée à la place de la sonde PT1000 sur le connecteur 2 broches TEMP, carte sous tension. Lectures attendues : 1 000 Ω donne 0 °C, 1 100 Ω environ 26 °C, 1 385 Ω environ 100 °C ; une boîte à décades balaie la plage. Lecture juste : la sonde ou son câble est en cause. Lecture fausse ou défaut maintenu : la voie de la carte est en cause. Essai bref, élément chauffant débranché : la protection thermique est neutralisée pendant l'essai.</desc>
  <style>
