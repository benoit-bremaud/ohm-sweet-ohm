<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Entonnoir de comparaison du connecteur à la résistance de référence</title>
  <desc id="d">Carte hors tension, la même mesure faite de plus en plus près du composant sur la voie suspecte et sur sa jumelle. Au connecteur : broche b de TEMP 2 à 1 071 Ω, TEMP 1 à 995 Ω. Au via, côté soudure : mêmes lectures, la piste est saine. Sur la résistance : R25 à 1 071 Ω, ses jumelles R82 et R24 à 994 Ω. R25 a dérivé de 7 % sur 1 000 Ω, 8 % sur ses jumelles. La lecture est trop haute : un chemin parallèle ne pouvant que la baisser, R25 est en cause.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="500" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">L'entonnoir : du connecteur à la résistance qui a dérivé</text>
  <text class="mut" x="24" y="60" font-size="14">Carte hors tension : la même mesure, de plus en plus près du composant, sur la voie suspecte et sa jumelle</text>
  <path class="panel" d="M40 100 H720 L700 190 H60 Z" stroke-width="1.5"/>
  <text class="fg" x="380" y="130" font-size="15" text-anchor="middle" font-weight="700">1. Connecteur</text>
  <text class="no" x="380" y="152" font-size="13" text-anchor="middle" font-weight="700">TEMP 2 broche b : 1 071 Ω</text>
  <text class="mut" x="380" y="170" font-size="12" text-anchor="middle">jumelle TEMP 1 : 995 Ω</text>
  <path class="panel" d="M80 210 H680 L660 300 H100 Z" stroke-width="1.5"/>
  <text class="fg" x="380" y="240" font-size="15" text-anchor="middle" font-weight="700">2. Via, côté soudure</text>
  <text class="no" x="380" y="262" font-size="13" text-anchor="middle" font-weight="700">TEMP 2 : 1 071 Ω, la piste est saine</text>
  <text class="mut" x="380" y="280" font-size="12" text-anchor="middle">jumelle TEMP 1 : 995 Ω</text>
  <path class="panel" d="M120 320 H640 L620 410 H140 Z" stroke-width="1.5"/>
  <text class="fg" x="380" y="350" font-size="15" text-anchor="middle" font-weight="700">3. Résistance</text>
  <text class="no" x="380" y="372" font-size="13" text-anchor="middle" font-weight="700">R25 : 1 071 Ω</text>
  <text class="mut" x="380" y="390" font-size="12" text-anchor="middle">jumelles R82, R24 : 994 Ω</text>
  <text class="ok" x="380" y="450" font-size="14" text-anchor="middle" font-weight="700">R25 : +7 % sur 1 000 Ω (+8 % sur ses jumelles)</text>
  <text class="mut" x="380" y="468" font-size="12" text-anchor="middle">lecture trop haute : un chemin parallèle ne peut que la baisser, R25 est en cause</text>
