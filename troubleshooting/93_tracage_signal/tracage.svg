<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Traçage d'un signal dans une chaîne de quatre étages</title>
  <desc id="d">Une chaîne de quatre étages, préampli, correcteur, ampli et sortie, reçoit un signal à son entrée ; la carte est sous tension, la pince de masse de l'oscilloscope est sur le 0 V. Mesure 1, au milieu de la chaîne, à la sortie de l'étage 2 : l'écran montre une sinusoïde, le signal est présent. Mesure 2, à la sortie de l'étage 3 : l'écran montre une trace plate, le signal est absent. Les sorties des étages 1 et 4 ne sont pas mesurées. Conclusion : l'entrée de l'étage 3 est correcte et sa sortie absente, la panne est dans l'étage 3, ou en aval si l'étage 4 charge sa sortie ; déconnecter la charge et mesurer de nouveau.</desc>
