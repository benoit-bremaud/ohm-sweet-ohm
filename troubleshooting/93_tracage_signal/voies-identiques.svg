<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 384" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Comparaison de la même mesure sur quatre voies identiques</title>
  <desc id="d">Un tableau compare quatre voies d'entrée identiques d'une même carte, mesurées aux mêmes points avec le même appareil, le même calibre et la même polarité. Rail local de la voie, sous tension : 2,68, 2,66, 2,71 et 2,64 V, aucune voie ne se distingue. Résistance de la broche à la masse, pointe rouge sur la broche : 12,40, 12,38, 3,05 et 12,41 kΩ, la voie 3 diffère. Mode diode, pointe rouge sur la masse : 0,552, 0,549, 0,214 et 0,551 V, la voie 3 diffère encore. Conclusion : deux lignes désignent la voie 3, à chercher entre son connecteur et le microcontrôleur ; le rail local ne la distinguait pas, une seule mesure ne suffit pas.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="384" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Comparer quatre voies identiques : la voie qui diffère</text>
  <text class="mut" x="24" y="60" font-size="14">Même mesure, mêmes points, même appareil, même calibre et même polarité sur chaque voie</text>
  <text class="fg" x="380.0" y="116" font-size="14" text-anchor="middle" font-weight="700">Voie 1</text>
  <text class="fg" x="480.0" y="116" font-size="14" text-anchor="middle" font-weight="700">Voie 2</text>
  <text class="fg" x="580.0" y="116" font-size="14" text-anchor="middle" font-weight="700">Voie 3</text>
  <text class="fg" x="680.0" y="116" font-size="14" text-anchor="middle" font-weight="700">Voie 4</text>
  <rect class="panel" x="16" y="136" width="714" height="48" rx="6"/>
  <text class="fg" x="24" y="166" font-size="13">Rail local de la voie, sous tension (V)</text>
  <text class="fg" x="380.0" y="166" font-size="14" text-anchor="middle">2,68</text>
  <text class="fg" x="480.0" y="166" font-size="14" text-anchor="middle">2,66</text>
  <text class="fg" x="580.0" y="166" font-size="14" text-anchor="middle">2,71</text>
  <text class="fg" x="680.0" y="166" font-size="14" text-anchor="middle">2,64</text>
  <rect class="panel" x="16" y="192" width="714" height="48" rx="6"/>
  <text class="fg" x="24" y="222" font-size="13">Ω broche → masse, rouge sur la broche (kΩ)</text>
  <text class="fg" x="380.0" y="222" font-size="14" text-anchor="middle">12,40</text>
  <text class="fg" x="480.0" y="222" font-size="14" text-anchor="middle">12,38</text>
  <text class="no" x="580.0" y="222" font-size="14" text-anchor="middle" font-weight="700">3,05</text>
  <text class="fg" x="680.0" y="222" font-size="14" text-anchor="middle">12,41</text>
  <rect class="panel" x="16" y="248" width="714" height="48" rx="6"/>
  <text class="fg" x="24" y="278" font-size="13">Mode diode, rouge sur la masse (V)</text>
  <text class="fg" x="380.0" y="278" font-size="14" text-anchor="middle">0,552</text>
  <text class="fg" x="480.0" y="278" font-size="14" text-anchor="middle">0,549</text>
  <text class="no" x="580.0" y="278" font-size="14" text-anchor="middle" font-weight="700">0,214</text>
  <text class="fg" x="680.0" y="278" font-size="14" text-anchor="middle">0,551</text>
  <text class="no" x="380" y="340" font-size="14" text-anchor="middle" font-weight="700">Deux lignes désignent la voie 3 : la chercher entre son connecteur et le microcontrôleur</text>
  <text class="mut" x="380" y="358" font-size="12" text-anchor="middle">le rail local ne la distingue pas : une seule mesure ne suffit pas</text>
</svg>
