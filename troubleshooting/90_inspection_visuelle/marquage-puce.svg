  <title id="t">Lecture du marquage d'un circuit intégré</title>
  <desc id="d">Un circuit intégré vu de dessus, la broche 1 en bas à gauche à côté d'un point. Il porte deux lignes : YA017, puis 2530 K4. YA017 est la référence, souvent abrégée : la fiche technique donne le code, ici celui du TS3A5017. 2530 est un code de date, par exemple l'année puis la semaine, ici 2025, semaine 30. K4 est un code de lot, qui sert à la traçabilité et ne dit rien de la référence. À droite, le même boîtier sous deux éclairages : en lumière de face, un reflet efface le marquage ; en lumière rasante, la gravure se lit. Le format des codes de date et de lot dépend du fabricant.</desc>
