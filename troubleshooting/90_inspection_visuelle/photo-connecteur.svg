  <title id="t">Photographier le dos d'un connecteur pour suivre ses broches</title>
  <desc id="d">Une barrette de six broches traversantes vue sur les deux faces d'une carte hors tension. À gauche, la face composants : la broche 1 est à gauche, près d'un trou de fixation qui sert de repère. À droite, la carte retournée comme une page, face joints : les six joints de brasure sont dans l'ordre inverse, la broche 1 est à droite, toujours du côté du trou de fixation. Un cadre en pointillé montre ce que la photo doit contenir, toutes les broches, nettes ; une lampe tenue de côté éclaire en lumière rasante. Trois étapes : choisir un repère visible des deux faces, photographier les deux faces et écrire les numéros sur la photo du dos, confirmer au bipeur la broche 1, ou une broche d'extrémité, d'une face à l'autre.</desc>
