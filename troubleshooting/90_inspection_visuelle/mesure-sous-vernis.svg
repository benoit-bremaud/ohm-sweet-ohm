  <title id="t">Mesure à travers un vernis de tropicalisation</title>
  <desc id="d">Coupe d'une carte recouverte de vernis de tropicalisation : un composant monté en surface sur deux pastilles, le tout sous une couche de vernis. Une pointe-aiguille, inclinée, traverse le vernis jusqu'à la terminaison métallique du composant ; carte hors tension et déchargée. À droite, les règles : une lampe UV-A fait briller le vernis s'il est fluorescent ; faute d'atteindre la terminaison, la pastille, mais la lecture inclut alors le joint de brasure ; dégager localement selon la fiche technique du vernis ; comparer à un composant identique ; jamais sur le corps du composant ni près des broches à pas fin ; après la réparation, revernir la zone au pinceau et laisser sécher.</desc>
