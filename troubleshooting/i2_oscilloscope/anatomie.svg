  <title id="t">Anatomie d'un oscilloscope numérique de paillasse</title>
  <desc id="d">Oscilloscope à quatre voies, écran affichant un signal carré jaune. Repères : 1 écran et graticule de 8 divisions sur 12, 2 réglages verticaux, 3 réglages horizontaux, 4 déclenchement, 5 entrées BNC des voies 1 à 4, 6 sortie de compensation, 7 sonde branchée sur la voie 1, avec son commutateur ×1 / ×10 et sa pince de masse.</desc>
