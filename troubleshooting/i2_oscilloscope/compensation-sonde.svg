  <title id="t">Régler la compensation d'une sonde ×10</title>
  <desc id="d">Trois écrans montrant le même signal carré. À gauche, sonde sous-compensée : les fronts sont arrondis. Au centre, sonde compensée : le sommet est plat. À droite, sonde surcompensée : un dépassement suit chaque front.</desc>
