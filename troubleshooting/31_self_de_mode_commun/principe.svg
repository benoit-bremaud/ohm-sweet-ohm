  <title id="t">Principe d'une self de mode commun</title>
  <desc id="d">Trois schémas d'une self de mode commun : deux bobinages côte à côte sur un même noyau, avec un point du même côté de chaque bobinage. Au centre, le courant utile va par un fil et revient par l'autre : les champs magnétiques s'annulent et le courant passe librement, comme dans deux fils. À droite, les parasites circulent dans le même sens dans les deux fils : les champs s'ajoutent et la self leur oppose une forte impédance. En continu, chaque bobinage n'est qu'un fil : c'est ce que l'ohmmètre contrôle.</desc>
