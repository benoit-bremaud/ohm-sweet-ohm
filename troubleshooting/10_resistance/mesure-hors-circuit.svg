  <title id="t">Mesure hors circuit : résistance des cordons et doigts sur les pointes</title>
  <desc id="d">Deux multimètres mesurent une résistance sortie de la carte, une pointe sur chaque patte. À gauche, sélecteur sur le calibre 200 Ω, résistance de 0,47 Ω : l'appareil lit 0,8 Ω, car les cordons ajoutent 0,3 Ω ; il faut retrancher la valeur lue pointes en court-circuit ou utiliser la touche REL. À droite, sélecteur sur le calibre 2 MΩ, résistance de 1 MΩ tenue avec un doigt sur chaque pointe : l'appareil lit 0,833 MΩ, car le corps se met en parallèle ; il ne faut toucher qu'une pointe ou utiliser des pinces.</desc>
