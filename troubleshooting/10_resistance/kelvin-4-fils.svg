  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Mesure 4 fils d'une résistance de faible valeur avec une alimentation limitée et un voltmètre</title>
  <desc id="d">Une alimentation de laboratoire en limitation de courant, voyant CC allumé, affiche 0,35 V et 1,000 A ; ses deux pinces crocodile tiennent les extrémités des pattes d'une résistance de 0,1 Ω, 5 W. Un multimètre, sélecteur sur volts continus, a ses deux pointes sur les pattes, entre les pinces et au ras du corps, pointe rouge du côté de la pince positive ; il lit 0,100 V. La résistance vaut la tension divisée par le courant : 0,100 V divisé par 1,000 A, soit 0,100 Ω. Le courant passe par les pinces, le voltmètre ne prélève presque rien : la résistance des cordons et des contacts ne fausse pas la mesure. En deux fils, l'ohmmètre aurait lu 0,4 Ω.</desc>
