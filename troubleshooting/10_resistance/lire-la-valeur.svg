  <title id="t">Lire la valeur d'une résistance : anneaux de couleur et marquage CMS</title>
  <desc id="d">À gauche, deux résistances à anneaux. Quatre anneaux marron, noir, orange, or : 1, 0, multiplicateur 1 000, tolérance 5 %, soit 10 kΩ. Cinq anneaux jaune, violet, noir, rouge, marron sur un corps bleu : 4, 7, 0, multiplicateur 100, tolérance 1 %, soit 47 kΩ. Chiffre de chaque couleur : noir 0, marron 1, rouge 2, orange 3, jaune 4, vert 5, bleu 6, violet 7, gris 8, blanc 9 ; or : multiplicateur 0,1 ou tolérance 5 % ; argent : multiplicateur 0,01 ou tolérance 10 %. À droite, cinq résistances CMS : 103 vaut 10 kΩ, 4702 vaut 47 kΩ, 4R7 vaut 4,7 Ω, 01C vaut 10 kΩ en code EIA-96, 0 est un cavalier 0 Ω.</desc>
