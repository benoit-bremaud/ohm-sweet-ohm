  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Lire la valeur : anneaux de couleur et marquage CMS</text>
  <text class="mut" x="24" y="60" font-size="14">Toujours lire la valeur attendue avant de mesurer : c'est elle qui donne le calibre et le verdict</text>
