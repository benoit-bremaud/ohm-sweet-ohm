  <title id="t">Mesure en circuit : une lecture au-dessus de la valeur nominale est concluante</title>
  <desc id="d">Un multimètre, sélecteur sur ohms calibre 200 kΩ, a ses pointes sur les deux pattes d'une résistance R1 soudée, marquée 100 kΩ à 5 %. Le reste du circuit relie les mêmes nœuds par des chemins parallèles inconnus, qui ne peuvent que faire baisser la lecture. L'appareil lit 148,3 kΩ, au-dessus de 105 kΩ : la résistance est défectueuse. Échelle de lecture : en dessous de 95 kΩ, rien de prouvé, lever une patte ; de 95 à 105 kΩ, probablement saine ; au-dessus, défectueuse.</desc>
