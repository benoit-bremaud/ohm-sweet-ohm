  <title id="t">Indices visuels d'une résistance en défaut</title>
  <desc id="d">Cinq vues de résistances sur une carte. Saine : anneaux nets et vernis intact, mais elle peut être ouverte quand même, il faut mesurer. Brunie : elle a chauffé longtemps, la carte est roussie dessous ; mesurer puis chercher pourquoi elle chauffe. Carbonisée : corps noirci ou fendu, anneaux illisibles ; elle est ouverte, chercher le court-circuit en aval. Résistance CMS fissurée : un trait fin en travers du corps après une flexion de la carte ; ouverte ou intermittente. Soudure fissurée : un anneau sombre autour de la patte, comparé à une soudure saine ; panne intermittente, refaire la soudure.</desc>
