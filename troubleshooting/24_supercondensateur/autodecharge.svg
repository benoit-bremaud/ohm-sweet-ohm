  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Autodécharge d'un supercondensateur sain ou défectueux</title>
  <desc id="d">Graphique de la tension aux bornes d'un supercondensateur 5,5 V chargé puis laissé seul, sur 600 heures. Supercondensateur sain : la tension descend lentement, il reste encore 3 V après 600 heures, soit 25 jours. Supercondensateur défectueux, à titre d'exemple : la tension passe sous 3 V en une journée. Symptôme : l'horloge ou les réglages se perdent après une coupure bien plus courte que prévu. Mesure : charger, isoler, puis relever la tension après 1 heure, 24 heures et une semaine. Débranchée depuis des semaines, une carte peut encore porter un supercondensateur chargé : vérifier au voltmètre.</desc>
