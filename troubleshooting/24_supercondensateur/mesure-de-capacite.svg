  <title id="t">Mesure de la capacité d'un supercondensateur par le temps de décharge</title>
  <desc id="d">Graphique de la tension aux bornes d'un supercondensateur chargé à 5 V puis déchargé dans une résistance de 1 kΩ, sur 20 minutes. On chronomètre le passage de 4 V à 2 V. Supercondensateur sain de 1 F : 11 minutes 33 secondes, soit 693 secondes ; 693 divisé par 0,69 fois 1 000 donne 1 F. Supercondensateur usé : 5 minutes 47 secondes, soit 347 secondes, ce qui donne 0,5 F. Formule : C égale la durée divisée par 0,69 fois R, durée en secondes, R en ohms, C en farads. Fin de vie : 30 % de capacité perdus, soit moins de 0,7 F pour un 1 F. Le capacimètre du multimètre ne sait pas lire un farad : sa plus grande gamme s'arrête bien avant.</desc>
