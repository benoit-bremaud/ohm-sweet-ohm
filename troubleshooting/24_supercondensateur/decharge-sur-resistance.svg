  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Décharge d'un supercondensateur dans une résistance</title>
  <desc id="d">À gauche, un supercondensateur 1 F 5,5 V avec une résistance de 100 Ω 2 W branchée entre ses deux pattes ; un multimètre, sélecteur sur volts continus, pointe rouge sur la patte positive et pointe noire sur la patte négative, lit 0,04 V : on peut mesurer, en revérifiant avant chaque mesure. La résistance reste branchée pendant toute la décharge. À droite, le graphique de la tension aux bornes en fonction du temps : partie de 5,5 V, elle passe sous 1 V après 3 minutes et atteint 0,04 V après 8 minutes. Au départ, 55 mA et 0,3 W dans la résistance ; la durée pour tomber sous 1 % vaut 5 fois R fois C, soit 500 secondes. Un condensateur de 1 000 µF, dans la même résistance, se vide en 0,5 seconde. Jamais de tournevis ni de fil en court-circuit : la résistance fixe le courant, le voltmètre dit quand c'est fini.</desc>
