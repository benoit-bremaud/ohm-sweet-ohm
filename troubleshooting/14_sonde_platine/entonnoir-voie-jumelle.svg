<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Entonnoir de comparaison d'une voie suspecte avec sa voie jumelle</title>
  <desc id="d">Carte hors tension et déchargée, ohmmètre, mêmes points sur la voie suspecte et sur sa voie jumelle, puis pointes inversées : même valeur, le chemin est purement résistif. Étape 1, au connecteur, broche b vers la masse : 1071 Ω contre 994 Ω. Étape 2, continuité de la broche b à la pastille de la résistance à travers le via : bip sur les deux voies, aucun écart. Étape 3, aux bornes de la résistance de référence : 1071 Ω contre 994 Ω. L'écart, +7,7 %, se retrouve aux bornes de la résistance : la résistance de référence a dérivé. Les pointes inversées donnent la même lecture : le chemin est purement résistif, ce n'est pas une jonction.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="408" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Remonter la voie suspecte, comparée à sa jumelle</text>
  <text class="mut" x="24" y="60" font-size="14">Hors tension, ohmmètre, mêmes points sur les deux voies ; pointes inversées : même valeur</text>
  <text class="no" x="250" y="108" font-size="14" text-anchor="middle" font-weight="700">Voie suspecte</text>
  <text class="ok" x="400" y="108" font-size="14" text-anchor="middle" font-weight="700">Voie jumelle</text>
  <text class="fg" x="560" y="108" font-size="14" text-anchor="middle" font-weight="700">Écart</text>
  <rect class="panel" x="30.0" y="128" width="700" height="58" rx="8" stroke-width="1.5"/>
  <text class="fg" x="44.0" y="153" font-size="13" font-weight="700">1. Connecteur</text>
  <text class="mut" x="44.0" y="171" font-size="11">broche b → masse</text>
  <text class="no" x="250" y="163" font-size="15" text-anchor="middle" font-weight="700">1071 Ω</text>
  <text class="fg" x="400" y="163" font-size="15" text-anchor="middle">994 Ω</text>
  <text class="no" x="560" y="163" font-size="14" text-anchor="middle" font-weight="700">+7,7 %</text>
  <rect class="panel" x="50.0" y="202" width="660" height="58" rx="8" stroke-width="1.5"/>
  <text class="fg" x="64.0" y="227" font-size="13" font-weight="700">2. Via</text>
  <text class="mut" x="64.0" y="245" font-size="11">bipeur, broche b → pastille</text>
  <text class="fg" x="250" y="237" font-size="15" text-anchor="middle">bip</text>
  <text class="fg" x="400" y="237" font-size="15" text-anchor="middle">bip</text>
  <text class="mut" x="560" y="237" font-size="14" text-anchor="middle">aucun</text>
  <rect class="panel" x="70.0" y="276" width="620" height="58" rx="8" stroke-width="1.5"/>
  <text class="fg" x="84.0" y="301" font-size="13" font-weight="700">3. Résistance</text>
  <text class="mut" x="84.0" y="319" font-size="11">aux bornes de R réf</text>
  <text class="no" x="250" y="311" font-size="15" text-anchor="middle" font-weight="700">1071 Ω</text>
