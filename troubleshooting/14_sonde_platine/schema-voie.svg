  <text class="fg" x="40" y="440" font-size="13">La carte calcule la température à partir de la sonde et de R réf : une dérive de R réf</text>
  <text class="fg" x="40" y="458" font-size="13">fausse la température sans aucun défaut sur la sonde.</text>
