<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Schéma partiel d'une voie d'entrée PT1000</title>
  <desc id="d">Schéma partiel type d'une voie d'entrée de sonde PT1000. La sonde est branchée sur les broches a et b d'un connecteur. La broche b rejoint la masse par une résistance de référence de 1 kΩ à 0,1 %. La broche a passe par un filtre : un condensateur vers la masse, précédé d'une résistance série supposée, dessinée en pointillé, puis entre dans un multiplexeur analogique à quatre voies, dont la sortie attaque l'entrée du convertisseur analogique-numérique du microcontrôleur. La source d'excitation dépend de la carte et n'est pas représentée ; sur certains appareils, une carte de filtrage s'intercale entre la sonde et le connecteur. La carte calcule la température à partir de la sonde et de la résistance de référence : une dérive de celle-ci fausse la température sans défaut sur la sonde.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="480" rx="16"/>
