<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 408" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <!-- Generated by scripts/figures (`just figures`): edit the generator, not this file. -->
  <title id="t">Effet d'une dérive de la résistance de référence sur la température lue</title>
  <desc id="d">Calcul d'exemple pour une mesure ratiométrique : la carte mesure le rapport entre la tension de la sonde et celle de la résistance de référence, puis le multiplie par la valeur nominale de la référence. Sonde PT1000 à 20 °C : 1077,9 Ω. Résistance de référence réelle : 1071 Ω au lieu de 1000 Ω. Rapport mesuré : 1,0065 ; la carte attribue 1006,5 Ω à la sonde et affiche 1,7 °C, soit une erreur de −18,3 °C. Règle : une référence qui monte fait lire froid, une référence qui baisse fait lire chaud ; 1 % de dérive vaut environ 2,6 °C autour de 20 °C.</desc>
  <style>
    .bg{fill:#ffffff}.fg{fill:#1f2933}.mut{fill:#5f6b7a}
    .wire{stroke:#1f2933;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .panel{fill:#f3f5f8;stroke:#d5dbe3}.grid{stroke:#d5dbe3;stroke-width:1.5;stroke-dasharray:5 5;fill:none}
    .ok{fill:#15803d}.no{fill:#b91c1c}.warn{fill:#b45309}.blue{fill:#2563eb}.amber{fill:#b45309}
    .blk{stroke:#20242b}.blkf{fill:#20242b}
    .flow{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1 13;animation:run 1.1s linear infinite}
    .fb{stroke:#2563eb}.fa{stroke:#d97706}.fr{stroke:#dc2626}
    @keyframes run{to{stroke-dashoffset:-14}}
    @media (prefers-reduced-motion: reduce){.flow{animation:none}}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.fg{fill:#e6edf3}.mut{fill:#9aa7b4}.wire{stroke:#c9d1d9}
      .panel{fill:#161b22;stroke:#30363d}.grid{stroke:#30363d}
      .ok{fill:#4ade80}.no{fill:#f87171}.warn{fill:#fbbf24}.blue{fill:#60a5fa}.amber{fill:#fbbf24}
      .blk{stroke:#8b949e}.blkf{fill:#8b949e}.fb{stroke:#60a5fa}.fa{stroke:#fbbf24}.fr{stroke:#f87171}
    }
  </style>
  <rect class="bg" width="760" height="408" rx="16"/>
  <text class="fg" x="24" y="38" font-size="20" font-weight="700">Une référence qui monte de 7,1 % : la voie lit 18,3 °C trop froid</text>
  <text class="mut" x="24" y="60" font-size="14">Calcul d'exemple, mesure ratiométrique : la carte multiplie le rapport mesuré par la valeur nominale de R réf</text>
  <text class="fg" x="60" y="112" font-size="14">Sonde PT1000 à 20 °C</text>
  <text class="fg" x="560" y="112" font-size="15" text-anchor="end" font-weight="700">1077,9 Ω</text>
  <text class="fg" x="60" y="146" font-size="14">R réf réelle (nominale 1000 Ω)</text>
  <text class="no" x="560" y="146" font-size="15" text-anchor="end" font-weight="700">1071 Ω</text>
  <text class="fg" x="60" y="180" font-size="14">Rapport mesuré, sonde / R réf</text>
  <text class="fg" x="560" y="180" font-size="15" text-anchor="end" font-weight="700">1,0065</text>
  <text class="fg" x="60" y="214" font-size="14">Multiplié par la valeur nominale de R réf</text>
  <text class="fg" x="560" y="214" font-size="15" text-anchor="end" font-weight="700">× 1000 Ω</text>
  <text class="fg" x="60" y="248" font-size="14">Résistance attribuée à la sonde</text>
  <text class="no" x="560" y="248" font-size="15" text-anchor="end" font-weight="700">1006,5 Ω</text>
  <text class="fg" x="60" y="282" font-size="14">Température affichée</text>
  <text class="no" x="560" y="282" font-size="15" text-anchor="end" font-weight="700">1,7 °C</text>
  <path class="grid" d="M60 298 H560"/>
  <text class="fg" x="60" y="326" font-size="15" font-weight="700">Erreur</text>
  <text class="no" x="560" y="326" font-size="17" text-anchor="end" font-weight="700">−18,3 °C</text>
  <text class="mut" x="60" y="366" font-size="12">Règle : une référence qui monte fait lire froid, une référence qui baisse fait lire chaud ;</text>
  <text class="mut" x="60" y="384" font-size="12">1 % de dérive vaut environ 2,6 °C autour de 20 °C.</text>
